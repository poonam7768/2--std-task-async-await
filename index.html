<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>std-task</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css"
     integrity="sha384-xOolHFLEh07PJGoPkLv1IbcEPTNtaed2xpHsD9ESMhqIYd0nLMwNLD69Npy4HI+N" crossorigin="anonymous">
     <link rel="stylesheet" href="./style.css">

<body class="bg-info">
   <div class="container">
    <div class="row">
        <div class="col-md-4">
            <div class="card mt-4">
                <h3 class="text-center bg-secondary">Student Information!!</h3>
                <div class="card-body">
                    <form id="stdform">
                        <div class="form-group">
                            <label for="fname">Enter First Name:</label>
                            <input required type="text" id="fname" class="form-control">
                        </div>

                         <div class="form-group">
                            <label for="lname">Enter Last Name:</label>
                            <input required type="text" id="lname" class="form-control">
                         </div>

                        <div class="form-group">
                            <label for="email">Enter Email:</label>
                            <input required type="text" id="email" class="form-control">
                        </div>

                        <div class="form-group">
                            <label for="contact">Enter phone:</label>
                            <input required type="text" id="contact" class="form-control">
                        </div>

                        <button type="submit" id="addbtn" class="btn btn-secondary btn-block btn-sm mt-3">Add</button>
                        <button type="button" id="updatebtn" class="btn btn-secondary btn-block btn-sm mt-3 d-none">update</button>
                    </form>
                </div>
            </div>
        </div>
        <div class="col-md-6">
            <table class=" table table-bordered text-center mt-4 text-dark bg-white">
                <thead class="bg-secondary text-white">
                    <tr>
                        <td>sr.no.</td>
                        <td>first Name</td>
                        <td>Last Name</td>
                        <td>Email</td>
                        <td>Contact</td>
                        <td>Edit</td>
                        <td>Delete</td>
                    </tr>
                </thead>
                <tbody id="tableInfo" class="bg-white text-dark">

                        <td>1</td>

                        <td><button class="btn btn-sm btn-primary">Edit</button></td>
                        <td><button class="btn btn-sm btn-danger">Update</button></td>
                    </tr> -->
                </tbody>
            </table>

        </div>
    </div>
   </div>




<div class="spinner d-none" id="spinner">
   <div class="spinner-border" role="status">
  <span class="sr-only">Loading...</span>
</div> 
</div>

<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
